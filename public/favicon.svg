<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background square -->
  <rect width="32" height="32" fill="#DFE104"/>
  
  <!-- Compass circle -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Compass needle (North - up, black) -->
  <polygon points="16,6 13.5,16 16,14 18.5,16" fill="#000000"/>
  
  <!-- Compass needle (South - down, dark gray) -->
  <polygon points="16,26 13.5,16 16,18 18.5,16" fill="#333333"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.8" fill="#000000"/>

  <!-- Cardinal tick marks -->
  <line x1="16" y1="4" x2="16" y2="6.5" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="25.5" x2="16" y2="28" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="4" y1="16" x2="6.5" y2="16" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25.5" y1="16" x2="28" y2="16" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
