<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%">
  <defs>
    <!-- Glowing Neon Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Gradients -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
  </defs>

  <style>
    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(40px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
    }
    @keyframes pulse-cyan {
      0%, 100% { filter: drop-shadow(0 0 5px #00E5FF); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px #00E5FF); transform: scale(1.05); }
    }
    @keyframes pulse-purple {
      0%, 100% { filter: drop-shadow(0 0 5px #7000FF); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px #7000FF); transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes data-flow-1 {
      0% { cx: 220; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 400; opacity: 0; }
    }
    @keyframes data-flow-2 {
      0% { cx: 580; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 780; opacity: 0; }
    }
    
    .bg { fill: transparent; }
    
    .node-text {
      font-family: 'Inter', 'Arial', sans-serif;
      font-size: 20px;
      font-weight: 900;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    
    .sub-text {
      font-family: 'Inter', 'Arial', sans-serif;
      font-size: 12px;
      fill: #a0a0a0;
      letter-spacing: 1px;
    }

    .main-line {
      stroke: url(#line-grad);
      stroke-width: 4;
      stroke-dasharray: 8 8;
      animation: flow 20s linear infinite;
    }

    .data-packet-1 {
      fill: #00E5FF;
      filter: url(#glow-cyan);
      animation: data-flow-1 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    
    .data-packet-2 {
      fill: #7000FF;
      filter: url(#glow-purple);
      animation: data-flow-2 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      animation-delay: 1s;
    }

    .node-1 { animation: float 4s ease-in-out infinite, pulse-cyan 3s infinite; }
    .node-2 { animation: float 5s ease-in-out infinite; }
    .node-3 { animation: float 4s ease-in-out infinite, pulse-purple 3s infinite; animation-delay: 1s; }
  </style>

  <rect class="bg" width="100%" height="100%" />

  <!-- Connecting Lines -->
  <line class="main-line" x1="180" y1="100" x2="820" y2="100" />
  
  <!-- Data Packets Flowing -->
  <circle class="data-packet-1" cy="100" r="6" />
  <circle class="data-packet-1" cy="100" r="4" style="animation-delay: 0.2s;" />
  
  <circle class="data-packet-2" cy="100" r="6" />
  <circle class="data-packet-2" cy="100" r="4" style="animation-delay: 1.2s;" />

  <!-- Left Node: USER -->
  <g transform="translate(140, 100)" class="node-1">
    <circle r="45" fill="#0f172a" stroke="#00E5FF" stroke-width="4" filter="url(#glow-cyan)"/>
    <text class="node-text" text-anchor="middle" y="5">USER</text>
  </g>

  <!-- Center Node: GROQ AI -->
  <g transform="translate(500, 100)" class="node-2">
    <!-- Orbiting rings -->
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" transform="rotate(20)" />
    <ellipse cx="0" cy="0" rx="90" ry="30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3" transform="rotate(-40)" />
    
    <!-- Central AI Core -->
    <polygon points="0,-45 45,0 0,45 -45,0" fill="#0f172a" stroke="url(#line-grad)" stroke-width="4" />
    <text class="node-text" text-anchor="middle" y="-5">GROQ</text>
    <text class="sub-text" text-anchor="middle" y="15">LLAMA 3</text>
  </g>

  <!-- Right Node: ROADMAP -->
  <g transform="translate(860, 100)" class="node-3">
    <rect x="-55" y="-35" width="110" height="70" rx="15" fill="#0f172a" stroke="#7000FF" stroke-width="4" filter="url(#glow-purple)"/>
    <text class="node-text" text-anchor="middle" y="0">PLAN</text>
    <text class="sub-text" text-anchor="middle" y="20">GENERATED</text>
  </g>
</svg>
